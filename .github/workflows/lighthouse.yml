name: Update Lighthouse Scores

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: # Manual trigger from Actions UI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check for new deploy since last audit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — skipping deploy check"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_DEPLOY=$(gh run list --repo "$REPO" --workflow deploy.yml --branch main --status success --limit 1 --json updatedAt --jq '.[0].updatedAt')

          if [ ! -f src/data/lighthouse.json ]; then
            echo "lighthouse.json missing — running audit"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FETCHED_AT=$(jq -r '.fetchedAt' src/data/lighthouse.json)

          if [ -z "$LAST_DEPLOY" ]; then
            echo "No successful deploys found, skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$LAST_DEPLOY" > "$FETCHED_AT" ]]; then
            echo "New deploy found ($LAST_DEPLOY > $FETCHED_AT), running audit"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new deploy since last audit ($LAST_DEPLOY <= $FETCHED_AT), skipping"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PageSpeed Insights scores
        if: steps.check.outputs.should_run == 'true'
        id: psi
        run: |
          RESPONSE=$(curl -sf "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https://ratul0.github.io&category=PERFORMANCE&category=ACCESSIBILITY&category=BEST_PRACTICES&category=SEO&strategy=desktop") || {
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          read -r PERF A11Y BP SEO < <(echo "$RESPONSE" | jq -r '
            .lighthouseResult.categories |
            [.performance.score, .accessibility.score, .["best-practices"].score, .seo.score] |
            map(. * 100 | round) | @tsv')

          echo "perf=$PERF" >> "$GITHUB_OUTPUT"
          echo "a11y=$A11Y" >> "$GITHUB_OUTPUT"
          echo "bp=$BP" >> "$GITHUB_OUTPUT"
          echo "seo=$SEO" >> "$GITHUB_OUTPUT"

          if [ "$PERF" = "null" ] || [ "$A11Y" = "null" ] || [ "$BP" = "null" ] || [ "$SEO" = "null" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update lighthouse.json
        if: steps.psi.outputs.valid == 'true'
        env:
          PERF_SCORE: ${{ steps.psi.outputs.perf }}
          A11Y_SCORE: ${{ steps.psi.outputs.a11y }}
          BP_SCORE: ${{ steps.psi.outputs.bp }}
          SEO_SCORE: ${{ steps.psi.outputs.seo }}
        run: |
          jq -n \
            --argjson p "$PERF_SCORE" \
            --argjson a "$A11Y_SCORE" \
            --argjson b "$BP_SCORE" \
            --argjson s "$SEO_SCORE" \
            '{fetchedAt: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), scores: {performance:$p, accessibility:$a, bestPractices:$b, seo:$s}}' \
            > src/data/lighthouse.json

      - name: Commit and push
        if: steps.psi.outputs.valid == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lighthouse.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update lighthouse scores [skip ci]"
          git push
